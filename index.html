<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <meta name="description" content="Black Shadow Team explores cybersecurity, artificial intelligence, and digital creativity through responsible learning and practical projects.">
  <meta name="msvalidate.01" content="8D3DD5046D2C6F5F24FC58681AFF5F64">
  <meta name="google-site-verification" content="MYbuUtMOq_WX9Aa697czVvdBi4_0uDHPZ5olvJc80gw">
  <title>Black Shadow Team — Restoring website…</title>
</head>
<body>
  <p>Loading the Black Shadow Team website…</p>
  <script>
    fetch('https://raw.githubusercontent.com/black-shadow-team/black-shadow-team-website/0f1dd7373e22a51ede6421cbb6a98b43991b9c3/index.html')
      .then((response) => {
        if (!response.ok) throw new Error('Website source could not be loaded.');
        return response.text();
      })
      .then((html) => {
        const verificationTags = [
          '<meta name="msvalidate.01" content="8D3DD5046D2C6F5F24FC58681AFF5F64">',
          '<meta name="google-site-verification" content="MYbuUtMOq_WX9Aa697czVvdBi4_0uDHPZ5olvJc80gw">'
        ].join('\n  ');
        html = html.replace('</head>', `  ${verificationTags}\n</head>`);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(() => {
        document.body.textContent = 'The website is temporarily unavailable while it is being restored. Please try again shortly.';
      });
  </script>
</body>
</html>
